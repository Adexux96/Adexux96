
name: Update GitHub Stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check private stats token
        env:
          STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Missing GH_STATS_TOKEN secret"
            exit 1
          fi

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Adexux96&show_icons=true&include_all_commits=true&theme=dracula&locale=en&hide_border=false"
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate Language Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Adexux96&layout=compact&card_width=320&langs_count=6&theme=dracula&hide_border=false"
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Update README images
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          file = Path("README.md")
          content = file.read_text(encoding="utf-8")

          content = re.sub(
              r'https://github-stats-extended\.vercel\.app/api/top-langs\?[^"]+',
              './profile/top-langs.svg',
              content
          )

          content = re.sub(
              r'https://github-stats-extended\.vercel\.app/api\?[^"]+',
              './profile/stats.svg',
              content
          )

          file.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/stats.svg profile/top-langs.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub statistics"
            git push
          fi
